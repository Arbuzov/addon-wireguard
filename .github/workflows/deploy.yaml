---
name: Deploy

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  ci:
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    uses: ./.github/workflows/fork-app-ci.yaml

  # This fork publishes its own images instead of calling the shared
  # app-deploy.yaml, for two reasons:
  #   1. that workflow tags images `ghcr.io/${{ github.repository_owner }}/...`,
  #      which is `Arbuzov` here — GHCR rejects uppercase repository names and
  #      it offers no way to override the owner's casing, only the slug;
  #   2. its publish-* jobs dispatch to `<owner>/repository-edge` with a
  #      DISPATCH_TOKEN, which is the upstream add-on-repository-updater
  #      infrastructure. This fork is installed directly as a custom repository
  #      (see repository.yaml), so there is nothing to notify.
  # The multi-arch manifest is skipped for the same reason: config.yaml pulls
  # per-architecture images via `image: .../{arch}`, so a manifest list would
  # never be used.
  information:
    name: ℹ️ Gather app information
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.information.outputs.architectures }}
      build: ${{ steps.information.outputs.build }}
      description: ${{ steps.information.outputs.description }}
      name: ${{ steps.information.outputs.name }}
      owner: ${{ steps.image.outputs.owner }}
      slug: ${{ steps.information.outputs.slug }}
      target: ${{ steps.information.outputs.target }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version gate below compares against the tip this push replaced.
          fetch-depth: 0
          persist-credentials: false
      - name: 🚀 Run app information action
        id: information
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69 # v1.4.2
      - name: ℹ️ Compose image owner and version tag
        id: image
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          OWNER: ${{ github.repository_owner }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          TARGET: ${{ steps.information.outputs.target }}
        run: |
          # GHCR repository names must be lowercase; the GitHub owner is not.
          echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"

          # Home Assistant pulls `<image>:<config.yaml version>`, so config.yaml
          # is the single source of truth for the version — this fork is
          # installed as a custom repository, which means Home Assistant reads
          # config.yaml straight off the default branch. A release must
          # therefore be tagged to match it; tagging the image after the
          # release name instead would publish an image nothing ever pulls.
          version=$(yq --no-colors eval '.version' "${TARGET}/config.yaml")
          if [[ "${EVENT_NAME}" = "release" ]]; then
            tag="${TAG_NAME,,}"
            tag="${tag#v}"
            if [[ "${tag}" != "${version}" ]]; then
              echo "::error ::Release ${TAG_NAME} does not match ${TARGET}/config.yaml (${version}). Tag it v${version}, or bump config.yaml first."
              exit 1
            fi
          fi

          # Publishing is the last point where an unversioned change can still
          # be stopped, and unlike version-guard.yaml nothing bypasses it — that
          # guard only sees pull requests, so a direct push to the default
          # branch would otherwise reach the registry unbumped and simply never
          # be pulled. `dev` is upstream's placeholder and is never shippable
          # here: Home Assistant would read it once and never see a change again.
          if [[ -z "${version}" || "${version}" = "null" || "${version}" = "dev" ]]; then
            echo "::error ::${TARGET}/config.yaml has version '${version}'. This fork is installed as a custom repository, so Home Assistant reads that value directly and would never offer another update. Set a real version."
            exit 1
          fi

          # Judged against the tip this push replaced, so a push carrying
          # several commits is measured by its net effect: bumping in the first
          # and touching the app again in the second is a bump, not a
          # violation. Release and manual runs are exempt, both being
          # deliberate republishes of a version that already exists.
          zero="0000000000000000000000000000000000000000"
          previous_ref=""
          if [[ "${EVENT_NAME}" = "push" ]]; then
            if git rev-parse -q --verify "${BEFORE}^{commit}" > /dev/null; then
              previous_ref="${BEFORE}"
            elif [[ "${BEFORE}" = "${zero}" ]]; then
              echo "::notice ::Branch just created, no replaced tip to compare against."
            else
              # A force-push. The replaced tip is gone, so nothing reachable
              # from here says which version was last published, and HEAD^
              # would only see the final commit — a force-push whose app change
              # sits in an earlier commit would sail through it. Refuse rather
              # than guess: rewriting the default branch is deliberate enough
              # that confirming the publish by hand is not a burden.
              echo "::error ::This push replaced ${BEFORE}, which is no longer in the repository, so the version cannot be checked against what was last published. Re-run this workflow manually (workflow_dispatch) to publish ${version}."
              exit 1
            fi
          fi

          if [[ -n "${previous_ref}" ]] &&
            ! git diff --quiet "${previous_ref}" HEAD -- "${TARGET}"; then
            previous=$(git show "${previous_ref}:${TARGET}/config.yaml" |
              yq --no-colors eval '.version' -)
            if [[ "${previous}" = "${version}" ]]; then
              echo "::error ::This push changes ${TARGET}/ but leaves version at ${version}. Home Assistant compares that string against what it has installed, so it would never pull the image this build is about to publish. Bump ${TARGET}/config.yaml."
              exit 1
            fi

            # Differing is not enough: Home Assistant offers an update only
            # when the version RISES, so a lowered one publishes an image it
            # will never ask for — the same silent nothing-happens as leaving
            # it alone. version-guard.yaml applies this rule to pull requests;
            # both gates have to agree or the stricter one is decorative.
            # `dev` is excluded rather than compared, since it sorts above
            # every real version: the first push that leaves the placeholder
            # behind is a rise, not a regression.
            if [[ "${previous}" != "dev" ]]; then
              highest=$( { echo "${previous}"; echo "${version}"; } |
                sort -V | tail -1 )
              if [[ "${highest}" != "${version}" ]]; then
                echo "::error ::This push takes version backwards, ${previous} -> ${version}. Home Assistant only offers an update when the version increases, so it would never pull the image this build is about to publish."
                exit 1
              fi
            fi
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

  deploy:
    name: 👷 Build & Deploy ${{ matrix.architecture }}
    needs: information
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        architecture: ${{ fromJson(needs.information.outputs.architectures) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: ℹ️ Compose build flags
        id: flags
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          BUILD_FILE: ${{ needs.information.outputs.build }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.${ARCHITECTURE}" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"

          if [[ "${ARCHITECTURE}" = "amd64" ]]; then
            echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
          elif [[ "${ARCHITECTURE}" = "aarch64" ]]; then
            echo "platform=linux/arm64/v8" >> "$GITHUB_OUTPUT"
          else
            echo "::error ::Could not determine platform for architecture ${ARCHITECTURE}"
            exit 1
          fi
      - name: 🏗 Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          outputs: type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          # yamllint disable rule:line-length
          tags: |
            ghcr.io/${{ needs.information.outputs.owner }}/${{ needs.information.outputs.slug }}/${{ matrix.architecture }}:edge
            ghcr.io/${{ needs.information.outputs.owner }}/${{ needs.information.outputs.slug }}/${{ matrix.architecture }}:${{ needs.information.outputs.version }}
          # yamllint enable rule:line-length
          # zizmor: ignore[template-injection] - path input to action, not shell-executed
          context: ${{ needs.information.outputs.target }}
          file: ${{ needs.information.outputs.target }}/Dockerfile
          cache-from: |
            type=gha,scope=${{ matrix.architecture }}
            type=registry,ref=ghcr.io/${{ needs.information.outputs.owner }}/${{ needs.information.outputs.slug }}/${{ matrix.architecture }}:edge
          cache-to: type=gha,mode=max,scope=${{ matrix.architecture }}
          platforms: ${{ steps.flags.outputs.platform }}
          build-args: |
            BUILD_ARCH=${{ matrix.architecture }}
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ needs.information.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ needs.information.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ needs.information.outputs.version }}
